<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maurizio & Antonella — Il nostro Matrimonio</title>
  
  <!-- Favicon Arcobaleno per il Browser -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #5c6b57; /* Verde salvia */
      --accent: #d4af37;  /* Oro tenue */
      --paper-bg: #fbf9f4; /* Bianco avorio caldo effetto carta */
      --text: #2c2c2c;
      --envelope-shadow: rgba(0, 0, 0, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--paper-bg);
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0),
        radial-gradient(rgba(92, 107, 87, 0.03) 1px, transparent 0);
      background-size: 24px 24px, 12px 12px;
      background-position: 0 0, 6px 6px;
      color: var(--text);
      line-height: 1.6;
      text-align: center;
      overflow-x: hidden;
    }

    /* CONTENITORE PRINCIPALE CON CORNICE CHE SEGUE IL DOCUMENTO DALL'INIZIO ALLA FINE */
    .site-paper-wrapper {
      position: relative;
      max-width: 900px;
      margin: 15px auto;
      min-height: calc(100vh - 30px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
    }

    /* Angoli botanici decorativi posizionati ai 4 angoli reali del documento */
    .page-border-decor {
      position: absolute;
      font-size: 1.1rem;
      z-index: 10;
      opacity: 0.65;
      pointer-events: none;
    }
    .decor-tl { top: 10px; left: 12px; }
    .decor-tr { top: 10px; right: 12px; transform: scaleX(-1); }
    .decor-bl { bottom: 10px; left: 12px; transform: scaleY(-1); }
    .decor-br { bottom: 10px; right: 12px; transform: scale(-1, -1); }

    /* Blocco scroll durante l'apertura della busta (Fix iOS/Safari) */
    body.envelope-active {
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    
    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
    }

    /* === SCHERMATA BUSTA REALISTICA === */
    #envelope-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #e8e1d5;
      background: radial-gradient(circle at center, #fbf8f3 0%, #e8e1d5 100%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s ease;
      perspective: 1200px;
    }
    
    #envelope-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .light-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      animation: pulseGlow 3.5s infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.25); opacity: 0.9; }
    }

    /* NUVOLE DI ANIMAZIONE */
    .clouds-container {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .envelope-wrapper.open ~ .clouds-container {
      opacity: 1;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      filter: blur(8px);
      animation: disperseCloud 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .cloud-1 { width: 180px; height: 60px; top: 35%; left: calc(50% - 140px); animation-delay: 0.2s; }
    .cloud-2 { width: 220px; height: 75px; top: 48%; left: calc(50% - 100px); animation-delay: 0.1s; }
    .cloud-3 { width: 160px; height: 50px; top: 40%; left: calc(50% - 20px); animation-delay: 0.3s; }

    @keyframes disperseCloud {
      0% { transform: scale(0.5); opacity: 0; }
      40% { transform: scale(1.4); opacity: 0.9; }
      100% { transform: scale(2.5) translateY(-30px); opacity: 0; }
    }

    /* STRUTTURA BUSTA REALISTICA 3D */
    .envelope-wrapper {
      position: relative;
      width: 360px;
      height: 240px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 6;
    }

    .envelope-wrapper:hover {
      transform: translateY(-5px) rotateX(4deg);
    }

    .envelope-base {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e5ddd0 0%, #d8cebd 100%);
      border-radius: 8px;
      box-shadow: 0 20px 45px var(--envelope-shadow), 0 5px 15px rgba(0,0,0,0.08);
      border: 1px solid #d0c5b3;
    }

    .envelope-letter {
      position: absolute;
      top: 12px;
      left: 18px;
      width: 324px;
      height: 216px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border: 1px solid #e8e2d8;
      transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1) 0.6s, z-index 0s ease 0.6s;
      background-image: radial-gradient(#faf7f2 1px, transparent 0);
      background-size: 12px 12px;
      outline: 1px dashed var(--accent);
      outline-offset: -8px;
    }

    .envelope-wrapper.open .envelope-letter {
      transform: translateY(-140px);
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .envelope-letter h3 {
      font-family: 'Alex Brush', cursive;
      font-size: 2.8rem;
      color: var(--primary);
      line-height: 1.1;
      margin: 5px 0;
    }

    .envelope-pocket {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .envelope-pocket::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #eee6d8 0%, #e0d5c3 100%);
      clip-path: polygon(0 0, 50% 50%, 0 100%);
      border-radius: 8px 0 0 8px;
    }

    .envelope-pocket::after {
      content: '';
      position: absolute;
      top: 0; right: 0; width: 100%; height: 100%;
      background: linear-gradient(-135deg, #eae1d2 0%, #dbcfbd 100%);
      clip-path: polygon(100% 0, 50% 50%, 100% 100%);
      border-radius: 0 8px 8px 0;
    }

    .envelope-bottom {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(0deg, #dfd4c1 0%, #ebdcc8 100%);
      clip-path: polygon(0 100%, 50% 45%, 100% 100%);
      z-index: 4;
      border-radius: 0 0 8px 8px;
    }

    .envelope-flap {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #f3ebd9 0%, #e4d8c3 100%);
      clip-path: polygon(0 0, 50% 55%, 100% 0);
      transform-origin: top center;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    /* TIMBRO IN CERALACCA VERDE SALVIA */
    .wax-seal {
      position: absolute;
      top: 132px; left: 50%;
      transform: translate(-50%, -50%);
      width: 72px; height: 72px;
      background: radial-gradient(circle at 30% 30%, #768770 0%, #4a5746 70%, #353f33 100%);
      border-radius: 48% 52% 54% 46% / 51% 47% 53% 49%;
      z-index: 6;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.3);
      border: 1px solid #5c6b57;
      transition: transform 0.5s ease, opacity 0.4s ease;
      cursor: pointer;
    }

    .wax-seal span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 600; color: #dfb75e;
      letter-spacing: 1px;
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.open .wax-seal {
      transform: translate(-50%, -50%) scale(1.4);
      opacity: 0;
    }

    .envelope-hint {
      margin-top: 25px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7a7063;
      animation: blinkText 2s infinite ease-in-out;
      transition: opacity 0.5s ease;
      z-index: 6;
      position: relative;
    }

    .envelope-wrapper.open ~ .envelope-hint { opacity: 0; }

    @keyframes blinkText {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ANIMAZIONE SCROLL REVEAL */
    .reveal-section {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .reveal-section.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* === HERO BANNER CON FOTO PERFETTAMENTE CENTRATA SUI VOLTI === */
    header {
      position: relative;
      padding: 140px 20px 120px;
      background-image: linear-gradient(rgba(251, 249, 244, 0.88), rgba(251, 249, 244, 0.88)), url('foto.jpg');
      background-size: cover;
      background-position: center 28%;
      border-bottom: 1px solid #e0d8ce;
      border-top-left-radius: 7px;
      border-top-right-radius: 7px;
    }

    .names {
      font-family: 'Alex Brush', cursive;
      font-size: 4.8rem;
      color: var(--primary);
      margin-bottom: 10px;
      font-weight: normal;
      line-height: 1.2;
      animation: fadeInScale 1.5s ease;
      text-shadow: 0 2px 10px rgba(255,255,255,0.8);
    }

    @keyframes fadeInScale {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .date {
